name: Update Stock Prices

on:
  schedule:
    # Runs Mon–Fri at 22:00 UTC (after US market close ~4 PM EST)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:   # allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write      # needed to commit prices.json back to repo

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance

      - name: Fetch current prices
        run: python fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
